<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Whole-system UI stack is JetBrainsMono Nerd Font Mono.
       Monospace is deliberately untouched. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Segoe UI</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
