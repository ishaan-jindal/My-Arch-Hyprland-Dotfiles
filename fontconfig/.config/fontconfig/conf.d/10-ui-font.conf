<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- UI sans stack. SF Pro variants come first so that installing SF Pro
       later needs no config change; Inter is the installed fallback.
       Monospace is deliberately untouched. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Segoe UI</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
